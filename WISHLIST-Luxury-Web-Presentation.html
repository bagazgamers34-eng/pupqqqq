<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="A cinematic luxury wishlist experience.">
  <title>WISHLIST</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Manrope:wght@300;400;500;600&display=swap');

    :root {
      --black: #000;
      --white: #f5f5f1;
      --muted: rgba(255, 255, 255, .42);
      --line: rgba(255, 255, 255, .14);
      --ease-luxury: cubic-bezier(.16, 1, .3, 1);
      --ease-sharp: cubic-bezier(.76, 0, .24, 1);
      --slide-duration: 1.25s;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: var(--white);
      font-family: Inter, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      cursor: none;
    }

    button,
    a {
      color: inherit;
      font: inherit;
    }

    img {
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .preloader {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      background: #000;
      transition:
        opacity 1s var(--ease-luxury),
        visibility 1s var(--ease-luxury);
    }

    .preloader.loaded {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .preloader-line {
      position: relative;
      width: min(180px, 42vw);
      height: 1px;
      overflow: hidden;
      background: rgba(255, 255, 255, .12);
    }

    .preloader-line::after {
      content: "";
      position: absolute;
      inset: 0;
      background: #fff;
      transform: translateX(-101%);
      animation: preload 1.8s var(--ease-luxury) forwards;
    }

    @keyframes preload {
      to {
        transform: translateX(0);
      }
    }

    .grain {
      position: fixed;
      inset: -50%;
      z-index: 80;
      width: 200%;
      height: 200%;
      opacity: .034;
      pointer-events: none;
      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.65'/%3E%3C/svg%3E");
      animation: grain .22s steps(2) infinite;
    }

    @keyframes grain {
      0%   { transform: translate(0, 0); }
      25%  { transform: translate(2%, -3%); }
      50%  { transform: translate(-3%, 2%); }
      75%  { transform: translate(3%, 4%); }
      100% { transform: translate(-1%, -4%); }
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 75;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 45%, transparent 22%, rgba(0, 0, 0, .15) 58%, rgba(0, 0, 0, .8) 130%);
    }

    .cursor {
      position: fixed;
      z-index: 1100;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      pointer-events: none;
      background: rgba(255, 255, 255, .92);
      transform: translate(-50%, -50%);
      mix-blend-mode: difference;
    }

    .cursor-ring {
      position: fixed;
      z-index: 1099;
      width: 38px;
      height: 38px;
      border: 1px solid rgba(255, 255, 255, .45);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition:
        width .35s var(--ease-luxury),
        height .35s var(--ease-luxury),
        opacity .35s;
      mix-blend-mode: difference;
    }

    .presentation {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      isolation: isolate;
    }

    .slide {
      position: absolute;
      inset: 0;
      overflow: hidden;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      background: #000;
      transition:
        opacity .7s ease,
        visibility .7s;
    }

    .slide.active {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
      z-index: 5;
    }

    .slide.previous {
      visibility: visible;
      opacity: 0;
      z-index: 4;
    }

    .ambient {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 55%, rgba(255, 255, 255, .08), transparent 20%),
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, .025), transparent 58%);
      transition: opacity 1.6s ease;
    }

    .active .ambient {
      opacity: 1;
    }

    .progress {
      position: fixed;
      right: clamp(20px, 3vw, 48px);
      top: 50%;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 11px;
      transform: translateY(-50%);
    }

    .progress button {
      position: relative;
      width: 22px;
      height: 1px;
      padding: 0;
      border: 0;
      background: rgba(255, 255, 255, .2);
      cursor: none;
      transition:
        width .6s var(--ease-luxury),
        background .6s;
    }

    .progress button.active {
      width: 42px;
      background: rgba(255, 255, 255, .88);
    }

    .slide-number {
      position: fixed;
      left: clamp(20px, 3vw, 48px);
      bottom: clamp(20px, 3vw, 42px);
      z-index: 100;
      overflow: hidden;
      color: rgba(255, 255, 255, .48);
      font-size: 10px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: .26em;
    }

    .slide-number span {
      display: inline-block;
      transition: transform .7s var(--ease-luxury);
    }

    .sound-toggle {
      position: fixed;
      top: clamp(20px, 3vw, 42px);
      right: clamp(20px, 3vw, 48px);
      z-index: 100;
      display: flex;
      align-items: end;
      gap: 3px;
      height: 17px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: none;
      opacity: .5;
      transition: opacity .3s;
    }

    .sound-toggle:hover {
      opacity: 1;
    }

    .sound-toggle i {
      display: block;
      width: 1px;
      height: 5px;
      background: #fff;
    }

    .sound-toggle.on i:nth-child(1) { animation: sound 1s -.2s infinite; }
    .sound-toggle.on i:nth-child(2) { animation: sound .8s -.5s infinite; }
    .sound-toggle.on i:nth-child(3) { animation: sound 1.1s -.1s infinite; }
    .sound-toggle.on i:nth-child(4) { animation: sound .9s -.4s infinite; }

    @keyframes sound {
      0%, 100% { height: 4px; }
      50%      { height: 16px; }
    }

    .slide-title {
      position: absolute;
      z-index: 20;
      left: 50%;
      bottom: clamp(34px, 7vh, 82px);
      width: 100%;
      padding: 0 70px;
      overflow: hidden;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, .92);
      font-family: Manrope, sans-serif;
      font-size: clamp(11px, .82vw, 14px);
      font-weight: 400;
      line-height: 1.3;
      letter-spacing: .34em;
      text-align: center;
      text-transform: uppercase;
    }

    .slide-title span {
      display: inline-block;
      opacity: 0;
      transform: translateY(140%);
    }

    .active .slide-title span {
      animation: titleReveal 1.25s .9s var(--ease-luxury) forwards;
    }

    @keyframes titleReveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* INTRO */

    .intro {
      display: grid;
      place-items: center;
    }

    .intro-glow {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 32vw;
      height: 32vw;
      min-width: 320px;
      min-height: 320px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .034);
      filter: blur(70px);
      opacity: 0;
      transform: translate(-50%, -50%) scale(.2);
    }

    .intro.active .intro-glow {
      animation: introGlow 3s .2s var(--ease-luxury) forwards;
    }

    @keyframes introGlow {
      45% { opacity: .8; }
      100% {
        opacity: .32;
        transform: translate(-50%, -50%) scale(1.2);
      }
    }

    .wishlist-wrap {
      position: relative;
      z-index: 4;
      overflow: hidden;
      padding: .15em .2em;
    }

    .wishlist {
      display: block;
      color: #f5f4ef;
      font-family: Manrope, sans-serif;
      font-size: clamp(54px, 10vw, 170px);
      font-weight: 300;
      line-height: .88;
      letter-spacing: .18em;
      text-indent: .18em;
      opacity: 0;
      filter: blur(18px);
      transform: translateY(110%) scaleY(.5);
      text-transform: uppercase;
    }

    .intro.active .wishlist {
      animation: wishlistReveal 2s .35s var(--ease-luxury) forwards;
    }

    @keyframes wishlistReveal {
      50% {
        opacity: 1;
        filter: blur(0);
      }

      100% {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0) scaleY(1);
      }
    }

    .intro-line {
      position: absolute;
      top: calc(50% + clamp(42px, 7vw, 105px));
      left: 50%;
      width: min(390px, 42vw);
      height: 1px;
      overflow: hidden;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, .06);
    }

    .intro-line::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, #fff, transparent);
      transform: translateX(-110%);
    }

    .intro.active .intro-line::after {
      animation: scanLine 2.2s 1.4s var(--ease-sharp) forwards;
    }

    @keyframes scanLine {
      to {
        transform: translateX(110%);
      }
    }

    /* VEHICLE SLIDES */

    .vehicle-stage {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      perspective: 1400px;
    }

    .speed-lines {
      position: absolute;
      inset: -15%;
      overflow: hidden;
      opacity: 0;
      transform: skewX(-14deg);
    }

    .speed-lines span {
      position: absolute;
      left: -20%;
      width: 65%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .8), transparent);
      filter: blur(.5px);
    }

    .speed-lines span:nth-child(1) { top: 19%; width: 45%; }
    .speed-lines span:nth-child(2) { top: 31%; width: 75%; }
    .speed-lines span:nth-child(3) { top: 49%; width: 52%; }
    .speed-lines span:nth-child(4) { top: 67%; width: 80%; }
    .speed-lines span:nth-child(5) { top: 79%; width: 57%; }

    .active .speed-lines {
      animation: linesFlash .9s .06s ease-out forwards;
    }

    @keyframes linesFlash {
      0% {
        opacity: 0;
        transform: translateX(-20%) skewX(-14deg);
      }

      25% {
        opacity: .8;
      }

      100% {
        opacity: 0;
        transform: translateX(130%) skewX(-14deg);
      }
    }

    .floor {
      position: absolute;
      left: 50%;
      bottom: 13%;
      width: min(940px, 78vw);
      height: 18%;
      opacity: 0;
      transform: translateX(-50%) rotateX(72deg);
      background: radial-gradient(ellipse, rgba(255, 255, 255, .12), transparent 66%);
      filter: blur(16px);
    }

    .active .floor {
      animation: floorIn 1.4s .6s ease forwards;
    }

    @keyframes floorIn {
      to {
        opacity: .68;
      }
    }

    .vehicle {
      position: relative;
      z-index: 5;
      width: min(980px, 76vw);
      opacity: 0;
      will-change: transform, opacity, filter;
      transform-style: preserve-3d;
    }

    .vehicle-frame {
      position: relative;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 1.55 / 1;
      border-radius: 50%;
      filter:
        saturate(.42)
        contrast(1.18)
        brightness(.82);
      -webkit-mask-image: radial-gradient(ellipse 66% 64% at 50% 50%, #000 45%, transparent 78%);
      mask-image: radial-gradient(ellipse 66% 64% at 50% 50%, #000 45%, transparent 78%);
    }

    .vehicle-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(0, 0, 0, .9), transparent 20%, transparent 80%, rgba(0, 0, 0, .9)),
        linear-gradient(0deg, rgba(0, 0, 0, .96), transparent 33%, rgba(0, 0, 0, .22));
      mix-blend-mode: multiply;
    }

    .vehicle-frame::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background:
        linear-gradient(115deg, transparent 26%, rgba(255, 255, 255, .16) 43%, transparent 58%);
      transform: translateX(-110%);
    }

    .active .vehicle-frame::after {
      animation: reflection 2.6s 1.25s var(--ease-luxury) forwards;
    }

    @keyframes reflection {
      to {
        transform: translateX(110%);
      }
    }

    .vehicle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transform: scale(1.02);
    }

    .car.active .vehicle {
      animation: carArrival 2.15s .05s var(--ease-luxury) forwards;
    }

    @keyframes carArrival {
      0% {
        opacity: 0;
        filter: blur(28px);
        transform: translate3d(-150vw, 18vh, -600px) rotateY(50deg) rotateZ(-4deg) scale(.35);
      }

      23% {
        opacity: 1;
        filter: blur(8px);
      }

      43% {
        opacity: 1;
        filter: blur(0);
        transform: translate3d(8vw, 0, 0) rotateY(-12deg) rotateZ(0) scale(1.04);
      }

      68% {
        transform: translate3d(-2vw, 0, 0) rotateY(8deg) scale(.99);
      }

      100% {
        opacity: 1;
        filter: blur(0);
        transform: translate3d(0, 0, 0) rotateY(0) scale(1);
      }
    }

    .car.active .vehicle-frame {
      animation: carFloat 7s 2.3s ease-in-out infinite;
    }

    @keyframes carFloat {
      0%, 100% {
        transform: translateY(0) rotateY(-1.5deg) rotateX(0);
      }

      50% {
        transform: translateY(-10px) rotateY(2deg) rotateX(1deg);
      }
    }

    .headlight {
      position: absolute;
      z-index: 15;
      left: 29%;
      top: 48%;
      width: 70px;
      height: 14px;
      border-radius: 50%;
      opacity: 0;
      transform: rotate(-5deg);
      background: rgba(236, 246, 255, .95);
      box-shadow:
        0 0 12px rgba(220, 240, 255, .9),
        0 0 42px rgba(160, 205, 255, .52),
        -80px 5px 110px rgba(160, 205, 255, .14);
      filter: blur(2px);
    }

    .car.active .headlight {
      animation: headlight 1.8s 1.05s ease-out forwards;
    }

    @keyframes headlight {
      0%   { opacity: 0; }
      15%  { opacity: 1; }
      28%  { opacity: .18; }
      42%  { opacity: .95; }
      100% { opacity: .42; }
    }

    .halo {
      position: absolute;
      left: 50%;
      top: 52%;
      width: min(800px, 70vw);
      height: min(800px, 70vw);
      border: 1px solid rgba(255, 255, 255, .06);
      border-radius: 50%;
      opacity: 0;
      transform: translate(-50%, -50%) scale(.45);
    }

    .halo::before,
    .halo::after {
      content: "";
      position: absolute;
      border: 1px solid rgba(255, 255, 255, .035);
      border-radius: inherit;
    }

    .halo::before {
      inset: 10%;
    }

    .halo::after {
      inset: 22%;
    }

    .active .halo {
      animation: haloIn 2.1s .5s var(--ease-luxury) forwards;
    }

    @keyframes haloIn {
      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    /* JET */

    .jet .vehicle {
      width: min(1100px, 83vw);
    }

    .jet .vehicle-frame {
      aspect-ratio: 1.85 / 1;
      filter:
        saturate(.25)
        contrast(1.15)
        brightness(.94);
      -webkit-mask-image: radial-gradient(ellipse 68% 66% at 50% 50%, #000 50%, transparent 79%);
      mask-image: radial-gradient(ellipse 68% 66% at 50% 50%, #000 50%, transparent 79%);
    }

    .jet .vehicle img {
      object-position: 50% 48%;
      transform: scale(1.04);
    }

    .jet.active .vehicle {
      animation: jetArrival 2.35s .05s var(--ease-luxury) forwards;
    }

    @keyframes jetArrival {
      0% {
        opacity: 0;
        filter: blur(22px);
        transform: translate3d(115vw, -65vh, -950px) rotateZ(-14deg) rotateY(-35deg) scale(.16);
      }

      28% {
        opacity: 1;
        filter: blur(7px);
      }

      52% {
        opacity: 1;
        filter: blur(0);
        transform: translate3d(-5vw, 3vh, 0) rotateZ(3deg) rotateY(12deg) scale(1.07);
      }

      75% {
        transform: translate3d(2vw, -1vh, 0) rotateZ(-1deg) rotateY(-6deg) scale(.99);
      }

      100% {
        opacity: 1;
        filter: blur(0);
        transform: translate3d(0, 0, 0) rotateZ(0) rotateY(0) scale(1);
      }
    }

    .jet.active .vehicle-frame {
      animation: jetFloat 6s 2.45s ease-in-out infinite;
    }

    @keyframes jetFloat {
      0%, 100% { transform: translateY(0) rotateZ(0); }
      50%      { transform: translateY(-13px) rotateZ(.45deg); }
    }

    .jet-trail {
      position: absolute;
      top: 50%;
      right: 28%;
      z-index: 2;
      width: 85vw;
      height: 4px;
      opacity: 0;
      transform-origin: right center;
      transform: rotate(-13deg) scaleX(0);
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .02), rgba(255, 255, 255, .45));
      filter: blur(3px);
    }

    .jet.active .jet-trail {
      animation: trail 1.1s .08s ease-out forwards;
    }

    @keyframes trail {
      0% {
        opacity: 0;
        transform: rotate(-13deg) scaleX(0);
      }

      25% {
        opacity: .9;
      }

      100% {
        opacity: 0;
        transform: rotate(-13deg) scaleX(1);
      }
    }

    /* MIAMI */

    .miami-photo {
      position: absolute;
      inset: -3%;
      opacity: 0;
      transform: scale(1.18);
      filter:
        saturate(.55)
        contrast(1.3)
        brightness(.42);
    }

    .miami-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .miami-photo::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(0, 0, 0, .58), transparent 32%, rgba(0, 0, 0, .34) 70%, #000 110%),
        linear-gradient(90deg, rgba(0, 0, 0, .7), transparent 35%, transparent 65%, rgba(0, 0, 0, .7));
    }

    .miami.active .miami-photo {
      animation: miamiReveal 2.5s var(--ease-luxury) forwards;
    }

    @keyframes miamiReveal {
      0% {
        opacity: 0;
        filter: saturate(.1) contrast(1.5) brightness(.08) blur(18px);
        transform: scale(1.23);
      }

      100% {
        opacity: 1;
        filter: saturate(.62) contrast(1.22) brightness(.57) blur(0);
        transform: scale(1.04);
      }
    }

    .architecture-mask {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
    }

    .architecture-mask::before,
    .architecture-mask::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 32%;
      background: #000;
    }

    .architecture-mask::before {
      left: 0;
      transform: translateX(0);
    }

    .architecture-mask::after {
      right: 0;
      transform: translateX(0);
    }

    .miami.active .architecture-mask::before {
      animation: curtainLeft 1.8s .15s var(--ease-luxury) forwards;
    }

    .miami.active .architecture-mask::after {
      animation: curtainRight 1.8s .15s var(--ease-luxury) forwards;
    }

    @keyframes curtainLeft {
      to { transform: translateX(-105%); }
    }

    @keyframes curtainRight {
      to { transform: translateX(105%); }
    }

    .window-frame {
      position: absolute;
      inset: clamp(22px, 5vw, 78px);
      z-index: 8;
      border: 1px solid rgba(255, 255, 255, .11);
      opacity: 0;
      transform: scale(.92);
    }

    .window-frame::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 1px;
      background: rgba(255, 255, 255, .08);
    }

    .window-frame::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 58%;
      height: 1px;
      background: rgba(255, 255, 255, .06);
    }

    .miami.active .window-frame {
      animation: frameIn 1.8s 1s var(--ease-luxury) forwards;
    }

    @keyframes frameIn {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .miami-light {
      position: absolute;
      z-index: 7;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #fff7d8;
      box-shadow:
        0 0 9px #fff2b3,
        0 0 28px rgba(255, 222, 135, .9);
      opacity: 0;
    }

    .miami.active .miami-light {
      animation: cityLight 2.5s 1.1s ease-in-out infinite alternate;
    }

    @keyframes cityLight {
      from { opacity: .12; transform: scale(.6); }
      to   { opacity: .92; transform: scale(1.25); }
    }

    .miami-light.one   { left: 24%; top: 45%; animation-delay: 1.2s; }
    .miami-light.two   { left: 42%; top: 36%; animation-delay: 1.8s; }
    .miami-light.three { right: 34%; top: 51%; animation-delay: 1.45s; }
    .miami-light.four  { right: 22%; top: 39%; animation-delay: 2.1s; }

    .swipe-flash {
      position: fixed;
      inset: 0;
      z-index: 70;
      pointer-events: none;
      opacity: 0;
      background: #fff;
    }

    .swipe-flash.show {
      animation: flash .75s ease-out forwards;
    }

    @keyframes flash {
      0%   { opacity: 0; }
      12%  { opacity: .08; }
      100% { opacity: 0; }
    }

    @media (max-width: 760px) {
      .progress {
        right: 17px;
      }

      .progress button {
        width: 13px;
      }

      .progress button.active {
        width: 25px;
      }

      .vehicle,
      .jet .vehicle {
        width: 110vw;
      }

      .vehicle-frame {
        border-radius: 35%;
      }

      .slide-title {
        bottom: 48px;
        padding: 0 52px;
        font-size: 9px;
        letter-spacing: .24em;
      }

      .window-frame {
        inset: 20px;
      }

      .wishlist {
        font-size: clamp(45px, 14vw, 90px);
        letter-spacing: .12em;
        text-indent: .12em;
      }

      .slide-number {
        left: 17px;
        bottom: 22px;
      }

      .sound-toggle {
        top: 22px;
        right: 18px;
      }
    }

    @media (pointer: coarse) {
      html,
      body,
      button {
        cursor: auto;
      }

      .cursor,
      .cursor-ring {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="preloader" id="preloader" aria-hidden="true">
    <div class="preloader-line"></div>
  </div>

  <div class="cursor" id="cursor"></div>
  <div class="cursor-ring" id="cursorRing"></div>
  <div class="grain"></div>
  <div class="vignette"></div>
  <div class="swipe-flash" id="swipeFlash"></div>

  <button class="sound-toggle" id="soundToggle" aria-label="Toggle sound">
    <i></i><i></i><i></i><i></i>
  </button>

  <nav class="progress" aria-label="Slides">
    <button class="active" data-slide="0" aria-label="Wishlist"></button>
    <button data-slide="1" aria-label="Mercedes-AMG"></button>
    <button data-slide="2" aria-label="Bombardier Global 6000"></button>
    <button data-slide="3" aria-label="House in Miami"></button>
  </nav>

  <div class="slide-number" aria-hidden="true">
    <span id="slideNumber">01 / 04</span>
  </div>

  <main class="presentation" id="presentation">

    <!-- 01 -->
    <section class="slide intro active" aria-label="Wishlist">
      <div class="ambient"></div>
      <div class="intro-glow"></div>

      <div class="wishlist-wrap">
        <h1 class="wishlist">WISHLIST</h1>
      </div>

      <div class="intro-line"></div>
    </section>

    <!-- 02 -->
    <section class="slide car" aria-label="Mercedes-AMG GT 63 S PRO">
      <div class="ambient"></div>
      <div class="halo"></div>

      <div class="vehicle-stage">
        <div class="speed-lines" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>

        <div class="floor"></div>

        <div class="vehicle">
          <div class="vehicle-frame">
            <img
              src="https://upload.wikimedia.org/wikipedia/commons/3/39/Mercedes-AMG_C192_GT_63_PRO_4MATIC%2B_%281%29.jpg"
              alt="Mercedes-AMG GT 63 PRO 4MATIC+"
              draggable="false"
            >
          </div>
          <div class="headlight"></div>
        </div>
      </div>

      <div class="slide-title">
        <span>Mercedes-AMG GT 63 S PRO</span>
      </div>
    </section>

    <!-- 03 -->
    <section class="slide jet" aria-label="Bombardier Global 6000">
      <div class="ambient"></div>
      <div class="halo"></div>
      <div class="jet-trail"></div>

      <div class="vehicle-stage">
        <div class="speed-lines" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>

        <div class="floor"></div>

        <div class="vehicle">
          <div class="vehicle-frame">
            <img
              src="https://upload.wikimedia.org/wikipedia/commons/6/61/Bombardier_Global_6000_N3877_BWI_MD1.jpg"
              alt="Bombardier Global 6000"
              draggable="false"
            >
          </div>
        </div>
      </div>

      <div class="slide-title">
        <span>Bombardier Global 6000</span>
      </div>
    </section>

    <!-- 04 -->
    <section class="slide miami" aria-label="House in Miami">
      <div class="miami-photo">
        <img
          src="https://upload.wikimedia.org/wikipedia/commons/3/36/Northern_Brickell_skyline_at_night_20081203.jpg"
          alt="Luxury Miami skyline at night"
          draggable="false"
        >
      </div>

      <div class="architecture-mask"></div>
      <div class="window-frame"></div>

      <div class="miami-light one"></div>
      <div class="miami-light two"></div>
      <div class="miami-light three"></div>
      <div class="miami-light four"></div>

      <div class="slide-title">
        <span>House in Miami</span>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const slides = [...document.querySelectorAll('.slide')];
      const dots = [...document.querySelectorAll('.progress button')];
      const slideNumber = document.getElementById('slideNumber');
      const flash = document.getElementById('swipeFlash');
      const soundToggle = document.getElementById('soundToggle');
      const preloader = document.getElementById('preloader');

      let current = 0;
      let locked = false;
      let touchStartY = 0;
      let touchStartX = 0;
      let audioEnabled = false;
      let audioContext = null;

      const pad = value => String(value).padStart(2, '0');

      function playTransitionSound(direction = 1) {
        if (!audioEnabled) return;

        if (!audioContext) {
          audioContext = new (
            window.AudioContext ||
            window.webkitAudioContext
          )();
        }

        const now = audioContext.currentTime;
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        const filter = audioContext.createBiquadFilter();

        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(direction > 0 ? 82 : 130, now);
        oscillator.frequency.exponentialRampToValueAtTime(
          direction > 0 ? 210 : 72,
          now + .34
        );

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(900, now);
        filter.frequency.exponentialRampToValueAtTime(180, now + .4);

        gain.gain.setValueAtTime(.0001, now);
        gain.gain.exponentialRampToValueAtTime(.065, now + .035);
        gain.gain.exponentialRampToValueAtTime(.0001, now + .44);

        oscillator.connect(filter);
        filter.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start(now);
        oscillator.stop(now + .46);
      }

      function restartAnimations(slide) {
        const animated = [
          ...slide.querySelectorAll(
            '.ambient, .wishlist, .intro-glow, .intro-line, ' +
            '.vehicle, .vehicle-frame, .speed-lines, .floor, ' +
            '.halo, .headlight, .jet-trail, .miami-photo, ' +
            '.architecture-mask, .window-frame, .miami-light, ' +
            '.slide-title span'
          )
        ];

        animated.forEach(element => {
          element.style.animation = 'none';
          void element.offsetWidth;
          element.style.animation = '';
        });
      }

      function goTo(index) {
        const next = Math.max(0, Math.min(slides.length - 1, index));
        if (next === current || locked) return;

        locked = true;
        const direction = next > current ? 1 : -1;
        const old = current;

        slides[old].classList.remove('active');
        slides[old].classList.add('previous');

        current = next;
        restartAnimations(slides[current]);
        slides[current].classList.add('active');

        dots.forEach((dot, i) => {
          dot.classList.toggle('active', i === current);
        });

        slideNumber.style.transform =
          `translateY(${direction > 0 ? '-110%' : '110%'})`;

        setTimeout(() => {
          slideNumber.textContent =
            `${pad(current + 1)} / ${pad(slides.length)}`;
          slideNumber.style.transition = 'none';
          slideNumber.style.transform =
            `translateY(${direction > 0 ? '110%' : '-110%'})`;

          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              slideNumber.style.transition =
                'transform .7s cubic-bezier(.16, 1, .3, 1)';
              slideNumber.style.transform = 'translateY(0)';
            });
          });
        }, 290);

        flash.classList.remove('show');
        void flash.offsetWidth;
        flash.classList.add('show');

        playTransitionSound(direction);

        setTimeout(() => {
          slides[old].classList.remove('previous');
          locked = false;
        }, 1350);
      }

      function next() {
        if (current < slides.length - 1) {
          goTo(current + 1);
        }
      }

      function previous() {
        if (current > 0) {
          goTo(current - 1);
        }
      }

      window.addEventListener(
        'wheel',
        event => {
          if (locked || Math.abs(event.deltaY) < 12) return;
          event.deltaY > 0 ? next() : previous();
        },
        { passive: true }
      );

      window.addEventListener('keydown', event => {
        if (['ArrowDown', 'ArrowRight', 'PageDown', ' '].includes(event.key)) {
          event.preventDefault();
          next();
        }

        if (['ArrowUp', 'ArrowLeft', 'PageUp'].includes(event.key)) {
          event.preventDefault();
          previous();
        }

        if (event.key === 'Home') {
          goTo(0);
        }

        if (event.key === 'End') {
          goTo(slides.length - 1);
        }
      });

      window.addEventListener(
        'touchstart',
        event => {
          touchStartY = event.changedTouches[0].clientY;
          touchStartX = event.changedTouches[0].clientX;
        },
        { passive: true }
      );

      window.addEventListener(
        'touchend',
        event => {
          const endY = event.changedTouches[0].clientY;
          const endX = event.changedTouches[0].clientX;
          const diffY = touchStartY - endY;
          const diffX = touchStartX - endX;

          if (Math.max(Math.abs(diffY), Math.abs(diffX)) < 50) return;

          if (Math.abs(diffY) > Math.abs(diffX)) {
            diffY > 0 ? next() : previous();
          } else {
            diffX > 0 ? next() : previous();
          }
        },
        { passive: true }
      );

      dots.forEach(dot => {
        dot.addEventListener('click', () => {
          goTo(Number(dot.dataset.slide));
        });
      });

      soundToggle.addEventListener('click', async () => {
        audioEnabled = !audioEnabled;
        soundToggle.classList.toggle('on', audioEnabled);

        if (audioEnabled) {
          if (!audioContext) {
            audioContext = new (
              window.AudioContext ||
              window.webkitAudioContext
            )();
          }

          if (audioContext.state === 'suspended') {
            await audioContext.resume();
          }

          playTransitionSound(1);
        }
      });

      const cursor = document.getElementById('cursor');
      const cursorRing = document.getElementById('cursorRing');

      let mouseX = innerWidth / 2;
      let mouseY = innerHeight / 2;
      let ringX = mouseX;
      let ringY = mouseY;

      window.addEventListener('mousemove', event => {
        mouseX = event.clientX;
        mouseY = event.clientY;

        cursor.style.left = `${mouseX}px`;
        cursor.style.top = `${mouseY}px`;
      });

      function animateCursor() {
        ringX += (mouseX - ringX) * .13;
        ringY += (mouseY - ringY) * .13;

        cursorRing.style.left = `${ringX}px`;
        cursorRing.style.top = `${ringY}px`;

        requestAnimationFrame(animateCursor);
      }

      animateCursor();

      document.querySelectorAll('button, a').forEach(element => {
        element.addEventListener('mouseenter', () => {
          cursorRing.style.width = '58px';
          cursorRing.style.height = '58px';
          cursorRing.style.opacity = '.55';
        });

        element.addEventListener('mouseleave', () => {
          cursorRing.style.width = '38px';
          cursorRing.style.height = '38px';
          cursorRing.style.opacity = '1';
        });
      });

      const images = [...document.images];
      const imagePromises = images.map(image => {
        if (image.complete) return Promise.resolve();

        return new Promise(resolve => {
          image.addEventListener('load', resolve, { once: true });
          image.addEventListener('error', resolve, { once: true });
        });
      });

      Promise.all(imagePromises).then(() => {
        setTimeout(() => {
          preloader.classList.add('loaded');
          restartAnimations(slides[0]);
        }, 700);
      });

      setTimeout(() => {
        preloader.classList.add('loaded');
      }, 4000);
    })();
  </script>
</body>
</html>
